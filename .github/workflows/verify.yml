name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Lint
        run: ruff check .
      - name: Security static analysis
        run: bandit -c pyproject.toml -r sentinel_trace
      - name: Dependency audit
        run: pip-audit
      - name: Agent-safety corpus gate
        run: sentinel-trace corpus corpus
      - name: End-to-end smoke
        run: |
          sentinel-trace replay examples/hijack-exfiltration.json --out /tmp/r.json --html /tmp/r.html
          test -s /tmp/r.html
